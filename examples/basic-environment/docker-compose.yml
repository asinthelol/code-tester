name: code-tester-example

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 10

  supervisor:
    image: code-tester-supervisor:v1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/suite
    stdin_open: true
    tty: false
